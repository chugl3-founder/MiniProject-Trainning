server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_management?serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.employee.management: INFO
  file:
    name: logs/application.log

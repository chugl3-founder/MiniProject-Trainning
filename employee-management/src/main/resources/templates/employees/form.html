<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">Employee Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="mb-4">
                <a th:href="@{/employees}"
                   class="text-decoration-none">
                    ← Back to Employees
                </a>

                <h2 class="fw-bold mt-3"
                    th:text="${pageTitle}">
                    Employee Form
                </h2>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="${employeeId != null}
                            ? @{/employees/{id}/edit(id=${employeeId})}
                            : @{/employees}"
                          th:object="${employee}"
                          method="post">

                        <!-- General errors -->
                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger">

                            <p th:each="error : ${#fields.globalErrors()}"
                               th:text="${error}"
                               class="mb-0"></p>

                        </div>

                        <!-- Employee name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Employee Name
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="Enter employee name">

                            <div class="invalid-feedback"
                                 th:errors="*{name}">
                            </div>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="Enter employee email">

                            <div class="invalid-feedback"
                                 th:errors="*{email}">
                            </div>

                        </div>

                        <!-- Department -->
                        <div class="mb-4">

                            <label class="form-label">
                                Department
                            </label>

                            <select th:field="*{departmentId}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid' : ''">

                                <option value="">
                                    -- Select Department --
                                </option>

                                <option th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.name}">
                                </option>

                            </select>

                            <div class="invalid-feedback"
                                 th:errors="*{departmentId}">
                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Employee
                            </button>

                            <a th:href="@{/employees}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>

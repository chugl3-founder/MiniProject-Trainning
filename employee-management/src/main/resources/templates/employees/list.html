<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Employee Management</h2>
            <p class="text-muted mb-0">
                Manage your company's employees
            </p>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/employees/statistics}"
               class="btn btn-outline-primary">
                📊 Statistics
            </a>
            <a th:href="@{/employees/new}"
               class="btn btn-primary">
                + Add Employee
            </a>
        </div>
    </div>

    <!-- Success message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <!-- Error message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Search -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form th:action="@{/employees}"
                  method="get"
                  class="d-flex gap-2">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search employee by name..."
                       th:value="${keyword}">

                <button type="submit"
                        class="btn btn-outline-primary">
                    Search
                </button>

                <a th:href="@{/employees}"
                   class="btn btn-outline-secondary">
                    Reset
                </a>
            </form>

        </div>
    </div>

    <!-- Employee table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="employee : ${employees}">

                        <td th:text="${employee.id}"></td>

                        <td th:text="${employee.name}"
                            class="fw-semibold"></td>

                        <td th:text="${employee.email}"></td>

                        <td th:text="${employee.department != null
                            ? employee.department.name
                            : 'Unassigned'}"></td>

                        <td class="text-center">

                            <a th:href="@{/employees/{id}/edit(id=${employee.id})}"
                               class="btn btn-sm btn-outline-warning">
                                Edit
                            </a>

                            <form th:action="@{/employees/{id}/delete(id=${employee.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Are you sure you want to delete this employee?')">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="5"
                            class="text-center text-muted py-4">
                            No employees found.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="text-muted small">
                Total employees:
                <span th:text="${#lists.size(employees)}"></span>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
